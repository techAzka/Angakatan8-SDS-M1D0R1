<!DOpCeE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Foto</title>

  <style>
body {
  margin: 0;
  font-family: Arial;
  color: white;

  background: radial-gradient(circle at top, #111, #000);
}

/* judul */
h2 {
  text-align: center;
  padding: 15px;
}

/* galeri scroll */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  padding: 10px;

  max-height: 85vh;   /* tinggi maksimal */
  overflow-y: auto;   /* scroll ke bawah */
}

/* gambar */
img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
  transition: 0.3s;
}

/* efek hover */
img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,170,255,0.5);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
  width: 38px;
  height: 38px;
  background: linear-gradient(90deg, #00aaff, #0066ff);
  color: white;
  text-decoration: none;
  border-radius: 50%;
  font-size: 16px;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 12px rgba(0,170,255,0.7);
}
  </style>
</head>
<body>
<video autoplay muted loop id="bgvideo">

<audio id="bgm" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById("bgm");
  audio.volume = 0.1;

  document.body.addEventListener("click", () => {
    audio.play();
  }, { once: true });
</script>

<div style="text-align:center; opacity:0.5; padding:15px;">
  © Angkatan 8 - Memories Never Fade
</div>

<script>
document.body.addEventListener("click", function (e) {

  // bikin titik kecil muncul pas klik
  const dot = document.createElement("div");
  dot.style.position = "absolute";
  dot.style.left = e.pageX + "px";
  dot.style.top = e.pageY + "px";
  dot.style.width = "10px";
  dot.style.height = "10px";
  dot.style.background = "#00aaff";
  dot.style.borderRadius = "50%";
  dot.style.transform = "translate(-50%, -50%)";
  dot.style.opacity = "0.8";
  dot.style.pointerEvents = "none";

  document.body.appendChild(dot);

  // hilang setelah 0.5 detik
  setTimeout(() => {
    dot.remove();
  }, 500);

});
</script>

</body>
</html>
