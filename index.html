<!DOCTYPE html>
<html>
<head>
  <title>Galeri Angkatan 8 SDS M1D0R1</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #050814, #000);
      color: white;
      overflow-x: hidden;
    }

    /* ANIME GLOW BACKGROUND */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,229,255,0.10), transparent 60%);
      z-index: -1;
    }

    h2 {
      text-align: center;
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff, 0 0 30px #00e5ff;
      margin: 15px 0;
      letter-spacing: 2px;
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,229,255,0.25);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(6px);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.06);
      box-shadow: 0 0 25px #00e5ff;
    }

    img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 8px;
      background: linear-gradient(90deg, #00e5ff, #7cf7ff);
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.85;
    }

    /* PARTICLE */
    .light {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #00e5ff;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0.5;
    }

    @keyframes fall {
      from { transform: translateY(-10vh); }
      to { transform: translateY(110vh); }
    }

    .copy {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      opacity: 0.5;
      color: #00e5ff;
    }
  </style>
</head>

<body>

<h2>GALERI ANGKATAN 8 SDS M1D0R1</h2>

<audio id="bgm" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<div class="gallery" id="g"></div>

<div class="copy">© 2026 • Develop™AzKa𖦤</div>

<script>
/* =========================
   GABUNG 1–61 + NAMA FILE
========================= */

const images = [
  ...Array.from({length: 61}, (_, i) => `${i+1}.jpg`),

  "Bagas.jpg","Darrel.jpg","Ripki.jpg","Salira.jpg",
  "Minka.jpg","Minka2.jpg","Minka3.jpg","Minka4.jpg",
  "Minka5.jpg","Minka6.jpg","Minka7.jpg",
  "Cecil.jpg","Cecil2.jpg","Cecil3.jpg","Cecil4.jpg",
  "Kekey.jpg","Sasa.jpg"
];

const g = document.getElementById("g");

images.forEach(img => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${img}" onerror="this.style.display='none'">
    <button class="btn" onclick="downloadImg('${img}')">DOWNLOAD</button>
  `;

  g.appendChild(card);
});

function downloadImg(file){
  const a = document.createElement("a");
  a.href = file;
  a.download = file;
  a.click();
}

/* MUSIC START (klik pertama) */
window.addEventListener("click", () => {
  document.getElementById("bgm").play();
}, { once: true });

/* PARTICLE ANIME */
for(let i=0;i<30;i++){
  const p = document.createElement("div");
  p.className = "light";
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (3+Math.random()*5) + "s";
  document.body.appendChild(p);
}
</script>

</body>
</html>
